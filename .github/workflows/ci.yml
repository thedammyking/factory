name: ci
on: push
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # The SKILL.md size check is a case in test/repo.test.mjs, so this runs it too.
      - run: node --test
